<div class="sidebar">
  <div class="logo-section">
    <div class="logo">
      <i class='bx bx-grid-alt'></i>
    </div>    
  </div>

  <nav class="nav-menu">
    <div class="menu-item" *ngFor="let item of menuItems" [class.active]="item.active" (click)="selectMenuItem(item)">
      <i [class]="item.icon"></i>
      <span>{{ item.label }}</span>
    </div>
  </nav>

  <div class="bottom-section">
  
    <div class="menu-item">
      <i class='bx bx-time'></i>
      <span>Recent</span>
    </div>

    <div class="menu-item">
      <i class='bx bx-help-circle'></i>
      <span>Help</span>
    </div>

     <div class="menu-item">
      <i class='bx bx-cog'></i>
      <span>Settings</span>
    </div>

    <div class="menu-item">
      <i class='bx bx-dots-horizontal-rounded'></i>
      <span>More</span>
    </div>
  </div>
</div>
