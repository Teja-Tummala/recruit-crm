<div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Edit Candidate Details</h2>
            <button class="close-btn" (click)="closeModal()">
                <i class="bx bx-x"></i>
            </button>
        </div>

        <div class="modal-body">
            <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
                <div class="form-section">
                    <h3>Personal Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input id="name" type="text" formControlName="name" class="form-control">
                            <div class="error-message"
                                *ngIf="editForm.get('name')?.invalid && editForm.get('name')?.touched">
                                Name is required
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input id="email" type="email" formControlName="email" class="form-control">
                            <div class="error-message"
                                *ngIf="editForm.get('email')?.invalid && editForm.get('email')?.touched">
                                Valid email is required
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input id="phone" type="tel" formControlName="phone" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="dateOfBirth">Date of Birth</label>
                            <input id="dateOfBirth" type="text" formControlName="dateOfBirth" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Professional Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="position">Position *</label>
                            <input id="position" type="text" formControlName="position" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="currentOrganization">Current Organization</label>
                            <input id="currentOrganization" type="text" formControlName="currentOrganization"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="skills">Skills</label>
                            <input id="skills" type="text" formControlName="skills" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="totalExperience">Total Experience</label>
                            <input id="totalExperience" type="text" formControlName="totalExperience"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="relevantExperience">Relevant Experience</label>
                            <input id="relevantExperience" type="text" formControlName="relevantExperience"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="currentEmploymentStatus">Employment Status</label>
                            <select id="currentEmploymentStatus" formControlName="currentEmploymentStatus"
                                class="form-control">
                                <option value="Employed">Employed</option>
                                <option value="Unemployed">Unemployed</option>
                                <option value="Freelancer">Freelancer</option>
                                <option value="Consultant">Consultant</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Location Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="location">Country</label>
                            <input id="location" type="text" formControlName="location" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="city">City</label>
                            <input id="city" type="text" formControlName="city" class="form-control">
                        </div>

                        <div class="form-group full-width">
                            <label for="fullAddress">Full Address</label>
                            <textarea id="fullAddress" formControlName="fullAddress" class="form-control"
                                rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Compensation Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="currentSalary">Current Salary</label>
                            <input id="currentSalary" type="text" formControlName="currentSalary" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="salaryExpectation">Salary Expectation</label>
                            <input id="salaryExpectation" type="text" formControlName="salaryExpectation"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="salaryType">Salary Type</label>
                            <select id="salaryType" formControlName="salaryType" class="form-control">
                                <option value="Annual">Annual</option>
                                <option value="Monthly">Monthly</option>
                                <option value="Hourly">Hourly</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="noticePeriod">Notice Period</label>
                            <input id="noticePeriod" type="text" formControlName="noticePeriod" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Additional Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="availableFrom">Available From</label>
                            <input id="availableFrom" type="text" formControlName="availableFrom" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="languageSkills">Language Skills</label>
                            <input id="languageSkills" type="text" formControlName="languageSkills"
                                class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" formControlName="status" class="form-control">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                                <option value="Submitted to Client">Submitted to Client</option>
                                <option value="Interviewed">Interviewed</option>
                                <option value="Selected">Selected</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label for="summary">Summary</label>
                            <textarea id="summary" formControlName="summary" class="form-control" rows="4"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()"
                [disabled]="candidateState.loading()">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary" (click)="onSubmit()"
                [disabled]="editForm.invalid || candidateState.loading()">
                <span *ngIf="candidateState.loading()" class="spinner"></span>
                {{ candidateState.loading() ? 'Saving...' : 'Save Changes' }}
            </button>
        </div>

        <div class="error-banner" *ngIf="candidateState.error()">
            <i class="bx bx-error-circle"></i>
            {{ candidateState.error() }}
            <button class="error-close" (click)="candidateState.resetError()">
                <i class="bx bx-x"></i>
            </button>
        </div>
    </div>
</div>
